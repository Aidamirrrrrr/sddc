summary: "The repository is a minimal TypeScript module for an in-memory note store. It defines a Note type with id, text, and createdAt, and provides functions to add, list, and get notes. Tests are written with bun:test. The package.json defines a test script using bun test. The README describes the basic functionality. The repository also contains specification and planning artifacts under evals/add-note-tag/ and policy files under .sddc/."
