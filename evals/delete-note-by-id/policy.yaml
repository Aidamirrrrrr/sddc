version: 1
changes: 
  max_files_per_task: 6
  max_created_files_per_task: 3
  max_generated_file_bytes: 131072
  forbid_paths: 
    - .git
    - .specs
    - .env
    - credentials
  require_test_before_implementation: true
  require_dependency_permission: true
  require_configuration_permission: true
  require_migration_permission: true
commands: 
  allowed_programs: 
    - bun
    - cargo
    - deno
    - go
    - make
    - node
    - npm
    - npx
    - pnpm
    - pytest
    - python
    - python3
    - yarn
  allow_external_network: false
budget: 
  max_model_calls: 400
sampling: 
  max_attempts: 3
dialogue: 
  max_clarification_rounds: 3
  max_revision_rounds: 5
execution: 
  default_approval_mode: trusted
  max_changed_lines_per_task: 400
  max_proposal_revisions: 2
  max_task_iterations: 3
  max_task_attempts: 3
  command_timeout_seconds: 120
  allow_git_checkpoints: false