name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: bun-linux-x64
            asset_name: codekeeper-linux-x64
          - target: bun-linux-arm64
            asset_name: codekeeper-linux-arm64
          - target: bun-darwin-arm64
            asset_name: codekeeper-macos-arm64
          - target: bun-darwin-x64
            asset_name: codekeeper-macos-x64
          - target: bun-windows-x64
            asset_name: codekeeper-windows-x64.exe

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build standalone executable
        run: bun build src/main.ts --compile --minify --target=${{ matrix.target }} --outfile=${{ matrix.asset_name }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: cd artifacts && sha256sum codekeeper-* > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            install.sh
            install.ps1
